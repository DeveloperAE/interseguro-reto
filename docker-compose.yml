services:
  api-node:
    build: ./api-node
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      PORT: "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api-go:
    build: ./api-go
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      PORT: "8080"
      NODE_API_URL: http://api-node:3000
    depends_on:
      api-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build: ./web
    ports:
      - "5173:8080"
    environment:
      PORT: "8080"
      GO_API_URL: ${GO_API_URL:-http://localhost:8080}
      NODE_API_URL: ${NODE_API_URL:-http://localhost:3000}
    depends_on:
      - api-go
      - api-node
